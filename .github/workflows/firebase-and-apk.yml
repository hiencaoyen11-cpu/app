name: Deploy to Firebase Hosting & Build Pure Wallet APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Build Web Application for Hosting
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: gen-lang-client-0643846513
          channelId: live

  build_android_apk:
    needs: build_and_deploy_firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Pure Mobile App
        run: |
          npm ci || npm install --no-audit
          npm run build:apk

      - name: Setup Capacitor and Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap init "Trust Wallet" "com.trustwallet.crypto" --web-dir=dist
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrustWallet-Pure-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
